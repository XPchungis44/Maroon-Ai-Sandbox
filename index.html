<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>maroon v1.1</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#121212; color:#e5e5e5; font-family:ui-sans-serif,system-ui,sans-serif; height:100dvh; display:flex; flex-direction:column; }
header { display:flex; gap:12px; align-items:center; padding:14px 16px; border-bottom:1px solid #262626; }
.logo { width:38px; height:38px; border-radius:12px; background:#7b1e1e; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
h1 { font-size:15px; }
.sub { font-size:11px; color:#7a7a7a; }
#settings { border-bottom:1px solid #262626; padding:10px 16px; }
#settings summary { cursor:pointer; color:#a1a1a1; font-size:12px; }
#settings .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
#settings input, #settings select { background:#0f0f0f; border:1px solid #333; color:#e5e5e5; border-radius:6px; padding:6px 8px; font-size:12px; }
#chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:85%; padding:9px 12px; border-radius:14px; font-size:14px; line-height:1.45; white-space:pre-wrap; }
.user { align-self:flex-end; background:#404040; }
.bot { align-self:flex-start; background:#262626; }
.err { color:#f87171; }
#composer { display:flex; gap:8px; padding:12px 16px 18px; border-top:1px solid #262626; }
#msg { flex:1; background:#262626; border:1px solid #333; color:#e5e5e5; border-radius:12px; padding:10px 12px; font-size:14px; resize:none; height:44px; }
#send { background:#7b1e1e; color:#fff; border:none; border-radius:12px; width:52px; font-size:13px; cursor:pointer; }
.hint { font-size:11px; color:#5f5f5f; padding:0 16px 10px; }
</style>
</head>
<body>
<header>
  <div class="logo">m</div>
  <div>
    <h1>maroon v1.1</h1>
    <div class="sub">personal AI — local and unrestricted</div>
  </div>
</header>
<details id="settings">
  <summary>engine settings</summary>
  <div class="row">
    <select id="mode" aria-label="Engine mode">
      <option value="ollama">Ollama direct</option>
      <option value="server">maroon server (API key)</option>
    </select>
    <input id="url" placeholder="http://localhost:11434" style="flex:1; min-width:150px" aria-label="Server URL">
    <input id="model" placeholder="llama3.2" aria-label="Model">
    <input id="key" placeholder="API key (server mode)" style="flex:1; min-width:130px" aria-label="API key">
  </div>
</details>
<div id="chat"></div>
<div class="hint">Served from GitHub Pages, talking to your own machine. Start Ollama with OLLAMA_ORIGINS=* ollama serve.</div>
<form id="composer">
  <textarea id="msg" placeholder="Message maroon..." aria-label="Message"></textarea>
  <button id="send" type="submit">send</button>
</form>
<script>
var S = {
  mode: localStorage.getItem("mrn_mode") || "ollama",
  url: localStorage.getItem("mrn_url") || "http://localhost:11434",
  model: localStorage.getItem("mrn_model") || "llama3.2",
  key: localStorage.getItem("mrn_key") || ""
};
var history = [];
function el(id) { return document.getElementById(id); }
function saveS() {
  localStorage.setItem("mrn_mode", S.mode);
  localStorage.setItem("mrn_url", S.url);
  localStorage.setItem("mrn_model", S.model);
  localStorage.setItem("mrn_key", S.key);
}
function loadUI() {
  el("mode").value = S.mode;
  el("url").value = S.url;
  el("model").value = S.model;
  el("key").value = S.key;
}
el("mode").addEventListener("change", function () { S.mode = el("mode").value; saveS(); });
el("url").addEventListener("input", function () { S.url = el("url").value; saveS(); });
el("model").addEventListener("input", function () { S.model = el("model").value; saveS(); });
el("key").addEventListener("input", function () { S.key = el("key").value; saveS(); });
function addMsg(role, text) {
  var d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  el("chat").appendChild(d);
  el("chat").scrollTop = el("chat").scrollHeight;
}
function trimSlash(u) {
  while (u.length > 1 && u.charAt(u.length - 1) === "/") u = u.slice(0, -1);
  return u;
}
var busy = false;
el("composer").addEventListener("submit", function (e) {
  e.preventDefault();
  var t = el("msg").value.trim();
  if (!t || busy) return;
  addMsg("user", t);
  el("msg").value = "";
  busy = true;
  var base = trimSlash(S.url || "http://localhost:11434");
  var p;
  if (S.mode === "server") {
    p = fetch(base + "/v1/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + S.key },
      body: JSON.stringify({ message: t })
    }).then(function (r) {
      if (!r.ok) throw new Error("server returned " + r.status + (r.status === 401 ? " — check your API key" : ""));
      return r.json();
    }).then(function (d) { return d.reply; });
  } else {
    history.push({ role: "user", content: t });
    p = fetch(base + "/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: S.model || "llama3.2", messages: history, stream: false })
    }).then(function (r) {
      if (!r.ok) throw new Error("Ollama returned " + r.status + (r.status === 404 ? " — run: ollama pull " + S.model : ""));
      return r.json();
    }).then(function (d) { return (d.message && d.message.content) || ""; });
  }
  p.then(function (reply) {
    history.push({ role: "assistant", content: reply });
    addMsg("bot", reply || "(empty reply)");
  }).catch(function (err) {
    addMsg("bot err", "Error: " + err.message + ". Start Ollama with OLLAMA_ORIGINS=* ollama serve, then ollama pull " + (S.model || "llama3.2") + ".");
  }).then(function () { busy = false; });
});
loadUI();
</script>
</body>
</html>
